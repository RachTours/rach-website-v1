name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify dependencies install
        run: npm ci --production

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd ~/domains/rach-tours.com/public_html
            git fetch origin
            git reset --hard origin/main
            # Install dependencies using Hostinger's Node path
            export PATH="/opt/alt/alt-nodejs24/root/usr/bin:$PATH"
            npm install --production
            # Restart Node.js app via Hostinger's passenger
            mkdir -p tmp && touch tmp/restart.txt
            echo "✅ Deployed at $(date)"
